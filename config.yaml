# LocalServer configuration.
#
# Parsed by src/config/parser.rs (a hand-written YAML subset: nested maps,
# block lists, scalars, "#" comments, quoted strings, size suffixes K/M/G).
# Validated at startup by src/config/validate.rs.
#
# Every server behaviour is driven from this file. Nothing is hardcoded.

servers:

  # ---------------------------------------------------------------------
  # Main site. Default server for its listeners, and reachable on two ports.
  # ---------------------------------------------------------------------
  - host: 127.0.0.1
    ports:
      - 8080
      - 8081
    server_names:
      - localhost
      - 127.0.0.1
    is_default: true
    client_max_body_size: 1M

    error_pages:
      400: error_pages/400.html
      403: error_pages/403.html
      404: error_pages/404.html
      405: error_pages/405.html
      408: error_pages/408.html
      413: error_pages/413.html
      500: error_pages/500.html
      501: error_pages/501.html

    routes:

      # Static site root. Directory requests serve index.html.
      - path: /
        methods:
          - GET
          - HEAD
        root: www
        index: index.html
        autoindex: false

      # Directory listing enabled, and deliberately no index file present.
      - path: /listing
        methods:
          - GET
        root: www/listing
        autoindex: true

      # Uploads: POST stores a file, DELETE removes one, GET serves it back.
      - path: /uploads
        methods:
          - GET
          - POST
          - DELETE
        root: uploads
        upload_dir: uploads
        autoindex: true

      # Same directory, but DELETE is NOT accepted -> must answer 405.
      # Used to demonstrate audit question A-16 side by side with /uploads.
      - path: /readonly
        methods:
          - GET
        root: uploads
        autoindex: true

      # CGI by extension. The interpreter is a config value, so adding a
      # second language is a config change, not a code change.
      - path: /cgi-bin
        methods:
          - GET
          - POST
        root: cgi-bin
        cgi:
          ".py": /usr/bin/python3

      # Redirection.
      - path: /old-page
        methods:
          - GET
        root: www
        redirect:
          status: 301
          target: /index.html

  # ---------------------------------------------------------------------
  # Virtual host sharing port 8080 with the server above, told apart by the
  # Host header. Not a port conflict: same host:port, different server_names.
  #   curl --resolve test.com:8080:127.0.0.1 http://test.com:8080/
  # ---------------------------------------------------------------------
  - host: 127.0.0.1
    ports:
      - 8080
    server_names:
      - test.com
      - www.test.com
    is_default: false
    client_max_body_size: 512K

    error_pages:
      404: error_pages/404.html

    routes:
      - path: /
        methods:
          - GET
        root: www/site2
        index: index.html
        autoindex: false

  # ---------------------------------------------------------------------
  # Third server on its own port, with a deliberately tiny body limit so the
  # 413 path is easy to demonstrate.
  # ---------------------------------------------------------------------
  - host: 127.0.0.1
    ports:
      - 8082
    server_names:
      - tiny.local
    is_default: true
    client_max_body_size: 1K

    error_pages:
      413: error_pages/413.html

    routes:
      - path: /
        methods:
          - GET
          - POST
        root: www
        index: index.html
        autoindex: false
