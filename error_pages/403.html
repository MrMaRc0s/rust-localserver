<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>403 Forbidden</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center;
           justify-content:center; background:#10151c; color:#e6edf3;
           font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:32rem; padding:2rem; text-align:center; }
    .code { font-size:4rem; font-weight:700; color:#58a6ff; line-height:1; }
    h1 { font-size:1.25rem; margin:.5rem 0 1rem; }
    p { color:#8b98a5; }
    a { color:#58a6ff; }
    footer { margin-top:2rem; font-size:.8rem; color:#8b98a5; }
  </style>
</head>
<body>
<main>
  <div class="code">403</div>
  <h1>Forbidden</h1>
  <p>Access to this resource is refused. It may be outside the configured route root, or a directory with listing disabled.</p>
  <p><a href="/">Back to the index</a></p>
  <footer>LocalServer</footer>
</main>
</body>
</html>
